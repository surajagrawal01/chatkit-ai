services:

  # =========================
  # PostgreSQL
  # =========================
  postgres:
    image: postgres:16-alpine
    container_name: chatkit-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-chatkit}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-chatkit}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  # =========================
  # ChatKit Application
  # =========================
  app:
    image: surajagrawal/chatkit:1.0.6
    container_name: chatkit-app
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

      DATABASE_URL: ${APP_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/chatkit}

      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}

      RATE_LIMIT_STORAGE: ${RATE_LIMIT_STORAGE:-local}
      REDIS_URL: ${APP_REDIS_URL:-}

    ports:
      - "${APP_PORT:-3000}:3000"

    command: >
      sh -c "
        ./node_modules/.bin/prisma migrate deploy &&
        node server.js
      "


# =========================
# Persistent Volumes
# =========================
volumes:
  postgres_data: